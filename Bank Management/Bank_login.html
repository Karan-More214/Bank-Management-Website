<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sys Bank - Secure Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="shortcut icon" href="../Images/fevicon.png" type="image/x-icon">

  <style>
    :root {
      --primary-blue: #00b3ff;
      --dark-bg: #0b0f18;
      --input-bg: rgba(255, 255, 255, 0.08);
    }
    
    body {
      background-color: #000;
      background-image: url('../Images/Webpage image.png');
      background-size: cover;
      background-position: left;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: rgba(11, 15, 24, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      color: #fff;
      box-shadow: 0 0 30px rgba(0, 179, 255, 0.4);
      border: 1px solid rgba(0, 179, 255, 0.2);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-container:hover {
      box-shadow: 0 0 40px rgba(0, 179, 255, 0.6);
      transform: translateY(-5px);
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, 
        var(--primary-blue), 
        #0062ff, 
        transparent);
      z-index: -1;
      border-radius: 22px;
      animation: borderGlow 3s linear infinite;
      background-size: 400%;
      opacity: 0.7;
    }
/* 
    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    } */

    .login-header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    .login-header h3 {
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 5px;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 179, 255, 0.5);
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .form-control {
      background-color: var(--input-bg);
      border: none;
      color: white;
      height: 50px;
      border-radius: 8px;
      padding: 12px 15px;
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(0, 179, 255, 0.2);
      outline: none;
    }

    .input-group-text {
      background-color: var(--input-bg);
      border: none;
      color: var(--primary-blue);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--primary-blue), #0062ff);
      border: none;
      border-radius: 8px;
      height: 50px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(0, 179, 255, 0.4);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 179, 255, 0.6);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .login-footer a {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      position: relative;
    }

    .login-footer a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--primary-blue);
      transition: width 0.3s ease;
    }

    .login-footer a:hover::after {
      width: 100%;
    }

    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .password-toggle:hover {
      color: var(--primary-blue);
    }

    .password-wrapper {
      position: relative;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      body {
        justify-content: center;
        padding-right: 0;
        background-position: center;
      }
      
      .login-container {
        margin-right: 0;
        padding: 30px;
      }
    }

    /* Loading animation */
    /* @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    } */

    .loading {
      animation: pulse 3.0s infinite ease-in-out;
    }
  </style>
</head>
<body>
  <div class="login-container animate__animated animate__fadeInRight">
    <div class="login-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#00b3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-3">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <h3>SECURE LOGIN</h3>
      <p>Access your Sys Bank account</p>
    </div>
    
    <form id="loginForm" action="../Html/Bank_main.html">
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" placeholder="Enter your username" required />
        </div>
      </div>
      
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="password-wrapper">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Enter your password" required />
          </div>
          <i class="fas fa-eye password-toggle" id="togglePassword"></i>
        </div>
      </div>
      
      <div class="d-flex justify-content-between mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
      </div>
      
      <div class="d-grid">
        <button type="submit" class="btn btn-login" id="loginBtn">
          <span id="btnText"><a href="../Html/Bank_main.html"></a>Login</span>
          <span id="btnLoader" class="d-none"><i class="fas fa-circle-notch fa-spin"></i> Authenticating...</span>
        </button>
      </div>
      
      <div class="login-footer">
        <p>Don't have an account? <a href="../Html/Bank_register.html">Register Now</a></p>
        <div class="mt-2">
          <a href="#" class="me-2"><i class="fas fa-shield-alt me-1"></i> Security</a>
          <a href="#"><i class="fas fa-question-circle me-1"></i> Help</a>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

</body>
</html>
